# Viste SMS — build the Android app (android-app/).
#
#   push / PR touching android-app/  -> debug APK (downloadable artifact) to prove it builds
#   push tag android-vX.Y.Z          -> signed release APK published as GitHub Release android-vX.Y.Z
#
# Release signing needs these repository secrets (see ANDROID.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Android releases are never marked "Latest" so the Windows app's auto-updater keeps
# following the desktop (vX.Y.Z) releases.

name: Android build & release

on:
  push:
    branches: [main]
    tags: ['android-v*.*.*']
    paths:
      - 'android-app/**'
      - '.github/workflows/android-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/android-v') }}
        run: node scripts/gradle.mjs assembleDebug

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#android-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match android-app/package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — see ANDROID.md"
            exit 1
          fi
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/viste-sms-release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          node scripts/gradle.mjs assembleRelease
          node scripts/gradle.mjs bundleRelease
          rm -f "$ANDROID_KEYSTORE_PATH"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs release/Viste-SMS-*.apk | head -n 3

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name==\"$GITHUB_REF_NAME\") | .id"); do
            echo "Removing existing release $id for $GITHUB_REF_NAME"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "$GITHUB_REF_NAME" \
            "release/Viste-SMS-$VERSION.apk" \
            "release/Viste-SMS-$VERSION.aab" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest=false \
            --title "Viste SMS Android $VERSION" \
            --notes "Viste SMS $VERSION for Android. Easiest install: open https://viste-sms.vercel.app in Chrome and tap **Install app**. Direct install: download **Viste-SMS-$VERSION.apk** on the phone and open it. **Viste-SMS-$VERSION.aab** is for uploading to Google Play."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: viste-sms-android-${{ github.sha }}
          path: |
            android-app/release/*.apk
            android-app/release/*.aab
          if-no-files-found: error
          retention-days: 14
