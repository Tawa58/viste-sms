<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Viste SMS</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: #f6f8fb;
        color: #0b1b2b;
      }
      .card {
        width: 100%;
        max-width: 420px;
        padding: 28px 22px;
        text-align: center;
        background: #fff;
        border: 1px solid #e3e8ef;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(11, 27, 43, 0.08);
      }
      img {
        width: 88px;
        height: 88px;
        object-fit: contain;
      }
      h1 {
        font-size: 18px;
        margin: 14px 0 6px;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        margin: 0 0 6px;
        opacity: 0.8;
      }
      button {
        margin-top: 16px;
        width: 100%;
        padding: 12px 18px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #0b3d5c;
        border: 0;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icon.png" alt="" />
      <h1>Can't reach Viste SMS</h1>
      <p>Check your internet connection. The app will reconnect automatically when you're back online.</p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script>
      var APP_URL = 'https://viste-sms.vercel.app/'
      function retry() {
        window.location.replace(APP_URL)
      }
      document.getElementById('retry').addEventListener('click', retry)
      window.addEventListener('online', retry)
    </script>
  </body>
</html>
