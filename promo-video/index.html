<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f7f9fb;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="45"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4.6"
        data-track-index="0"
      ></div>

      <div
        id="el-02-problem"
        class="scene"
        data-composition-id="02-problem"
        data-composition-src="compositions/frames/02-problem.html"
        data-start="4"
        data-duration="5.4"
        data-track-index="1"
      ></div>

      <div
        id="el-03-dashboard"
        class="scene"
        data-composition-id="03-dashboard"
        data-composition-src="compositions/frames/03-dashboard.html"
        data-start="9"
        data-duration="6.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-students"
        class="scene"
        data-composition-id="04-students"
        data-composition-src="compositions/frames/04-students.html"
        data-start="15"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div
        id="el-05-fees"
        class="scene"
        data-composition-id="05-fees"
        data-composition-src="compositions/frames/05-fees.html"
        data-start="20.5"
        data-duration="7"
        data-track-index="0"
      ></div>

      <div
        id="el-06-payroll"
        class="scene"
        data-composition-id="06-payroll"
        data-composition-src="compositions/frames/06-payroll.html"
        data-start="27"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div
        id="el-07-finance"
        class="scene"
        data-composition-id="07-finance"
        data-composition-src="compositions/frames/07-finance.html"
        data-start="32.5"
        data-duration="6.6"
        data-track-index="0"
      ></div>

      <div
        id="el-08-cta"
        class="scene"
        data-composition-id="08-cta"
        data-composition-src="compositions/frames/08-cta.html"
        data-start="38.5"
        data-duration="6.5"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 4);
        tl.fromTo("#el-02-problem", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 4);
        tl.to("#el-02-problem", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 9);
        tl.fromTo("#el-03-dashboard", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 9);
        tl.to("#el-03-dashboard", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 15);
        tl.fromTo("#el-04-students", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 15);
        tl.to("#el-04-students", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 20.5);
        tl.fromTo("#el-05-fees", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 20.5);
        tl.to("#el-05-fees", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 27);
        tl.fromTo("#el-06-payroll", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 27);
        tl.to("#el-06-payroll", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 32.5);
        tl.fromTo("#el-07-finance", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 32.5);
        tl.to("#el-07-finance", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 38.5);
        tl.fromTo("#el-08-cta", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 38.5);
        tl.to({}, { duration: 45 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
